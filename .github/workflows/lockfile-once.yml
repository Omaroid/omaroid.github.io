name: One-time lockfile bootstrap

on:
  pull_request:
    branches: [gh-pages]
    paths:
      - '.github/workflows/lockfile-once.yml'

permissions:
  contents: write

jobs:
  resolve-lock:
    # Only run for this repository's own PR; never execute untrusted fork code with a write token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Create pinned transitive dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Record immutable lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --staged --quiet; then
            echo 'Lockfile is already current'
          else
            git commit -m "chore(security): lock Astro dependencies for reproducible builds"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
