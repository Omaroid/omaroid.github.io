name: Build & deploy official portfolio

on:
  pull_request:
    branches: [gh-pages]
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify lockfile and install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Build static site
        run: npm run build
      - name: Verify generated pages and links
        run: node scripts/verify-build.mjs
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
    steps:
      - name: Wait for legacy branch publisher (if still enabled)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Pages currently also runs a native "pages build and deployment"
          # workflow for this branch. That workflow otherwise overwrites Astro.
          observed=false
          status=""
          for attempt in {1..42}; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=30" \
              --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .name == \"pages build and deployment\") | .status" | head -n 1)"
            if [ -n "$status" ]; then
              observed=true
              echo "Native Pages publisher: $status (check $attempt)"
              if [ "$status" = "completed" ]; then
                echo "Native branch deployment finished; Astro can now publish last."
                break
              fi
            elif [ "$attempt" -ge 6 ]; then
              echo "No native Pages run exists; GitHub Actions is likely the configured Pages source."
              break
            fi
            sleep 10
          done
          if [ "$observed" = true ] && [ "$status" != "completed" ]; then
            echo "Native Pages publisher did not complete; refusing to race it." >&2
            exit 1
          fi
      - name: Deploy official GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify production HTTPS and bilingual pages
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://omaroid.github.io"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 12 "$SITE/?verify=${{ github.sha }}" -o /tmp/portfolio-fr.html &&
               curl --fail --silent --show-error --location --max-time 12 "$SITE/en/?verify=${{ github.sha }}" -o /tmp/portfolio-en.html &&
               curl --fail --silent --show-error --location --max-time 12 "$SITE/experience/?verify=${{ github.sha }}" -o /tmp/portfolio-experience.html &&
               grep -q 'Des plateformes data' /tmp/portfolio-fr.html &&
               grep -q 'Data platforms' /tmp/portfolio-en.html &&
               grep -q 'IoT Fireman' /tmp/portfolio-fr.html &&
               grep -q 'CV Parser' /tmp/portfolio-en.html &&
               curl --fail --silent --show-error --location --max-time 12 "$SITE/projects/cv-parser-internship/" -o /tmp/portfolio-cv-fr.html &&
               curl --fail --silent --show-error --location --max-time 12 "$SITE/en/projects/cv-parser-internship/" -o /tmp/portfolio-cv-en.html &&
               grep -q 'Projet de stage' /tmp/portfolio-cv-fr.html &&
               grep -q 'Internship project' /tmp/portfolio-cv-en.html &&
               grep -q 'ENGIE' /tmp/portfolio-experience.html &&
               grep -q 'premium-surface' /tmp/portfolio-fr.html &&
               grep -q '/logos/clients/natixis.svg' /tmp/portfolio-experience.html &&
               grep -q '/logos/clients/edifixio.png' /tmp/portfolio-experience.html &&
               grep -q '/project-icons/dossierpro.png' /tmp/portfolio-fr.html &&
               grep -q '/project-icons/mission-radar.svg' /tmp/portfolio-fr.html &&
               curl --fail --silent --show-error --location --max-time 12 "$SITE/project-icons/dossierpro.png" -o /tmp/dossierpro-favicon.png &&
               curl --fail --silent --show-error --location --max-time 12 "$SITE/project-icons/mission-radar.svg" -o /tmp/radar-favicon.svg &&
               curl --fail --silent --show-error --location --max-time 12 "$SITE/logos/clients/natixis.svg" -o /tmp/natixis-logo.svg &&
               curl --fail --silent --show-error --location --max-time 12 "$SITE/logos/clients/edifixio.png" -o /tmp/edifixio-logo.png; then
              echo "Production HTTPS and FR/EN experience pages verified"
              exit 0
            fi
            echo "Production not updated yet (attempt $attempt/12); retrying"
            sleep 10
          done
          echo "Published site does not match the build" >&2
          exit 1
