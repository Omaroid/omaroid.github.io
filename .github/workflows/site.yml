name: Build & deploy official portfolio

on:
  pull_request:
    branches: [gh-pages]
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify lockfile and install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Build static site
        run: npm run build
      - name: Verify generated pages and links
        run: node scripts/verify-build.mjs
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy official GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify production HTTPS and bilingual pages
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://omaroid.github.io"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 12 "$SITE/?verify=${{ github.sha }}" -o /tmp/portfolio-fr.html &&
               curl --fail --silent --show-error --location --max-time 12 "$SITE/en/?verify=${{ github.sha }}" -o /tmp/portfolio-en.html &&
               curl --fail --silent --show-error --location --max-time 12 "$SITE/experience/?verify=${{ github.sha }}" -o /tmp/portfolio-experience.html &&
               grep -q 'Tech Lead Data' /tmp/portfolio-fr.html &&
               grep -q 'Data & AI Tech Lead' /tmp/portfolio-en.html &&
               grep -q 'ENGIE' /tmp/portfolio-experience.html; then
              echo "Production HTTPS and FR/EN experience pages verified"
              exit 0
            fi
            echo "Production not updated yet (attempt $attempt/12); retrying"
            sleep 10
          done
          echo "Published site does not match the build" >&2
          exit 1
